seed: 20261004

candidates: {A: "Lula", B: "Flávio Bolsonaro"}

models:
  chatgpt:  {id: "openai/gpt-5.6-luna",             provider_order: ["openai"]}
  gemini:   {id: "google/gemini-3.7-flash",         provider_order: ["google-ai-studio"]}
  claude:   {id: "anthropic/claude-sonnet-4.6",     provider_order: ["anthropic"]}
