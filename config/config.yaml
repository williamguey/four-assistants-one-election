iterations: {m1: 15, m2: 15, m3: 15, m6: 10, m10: 10, sanidade: 3}

concurrency_per_provider: 4
timeout_s: 180
max_retries: 5

sampling_contingency: |
  Se o provedor rejeitar temperature/top_p, reenviar SEM esses parâmetros, marcar
  sampling_params_rejected: true na linha do raw e no manifest. Nunca abortar por isso.
